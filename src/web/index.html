<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>cospan</title>
<style>
  :root {
    --bg: #0d0f14; --bg-2: #0b0d11;
    --panel: #161922; --panel-2: #1c2029; --edge: #262b36; --edge-2: #313745;
    --ink: #e8eaf0; --dim: #9aa3b4; --faint: #656d7e;
    --accent: #7aa2f7; --accent-2: #9d7cf5;
    --good: #7ee787; --warn: #e3b341; --bad: #f7768e;
    --telos: #bb9af7; --tension: #e3b341;
    --nav-h: 62px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: .55rem;
    padding: calc(.7rem + env(safe-area-inset-top)) 1.1rem .7rem;
    background: linear-gradient(180deg, rgba(13,15,20,.92), rgba(13,15,20,.72));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--edge);
  }
  header .logo { font-weight: 700; letter-spacing: .01em; font-size: 1.05rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  header .view-name { color: var(--faint); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; }
  header .spacer { flex: 1; }
  .dot { width: .62rem; height: .62rem; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--good); animation: pulse 2.4s infinite; }
  .dot.stale { background: var(--warn); }
  .dot.dead { background: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(126,231,135,.5); } 70% { box-shadow: 0 0 0 .42rem rgba(126,231,135,0); } 100% { box-shadow: 0 0 0 0 rgba(126,231,135,0); } }

  /* ---- layout ---- */
  main { max-width: 860px; margin: 0 auto; padding: 1rem 1.05rem calc(var(--nav-h) + env(safe-area-inset-bottom) + 1.2rem); }
  .view { display: none; animation: fade .22s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .13em; color: var(--faint); margin: 1.3rem .2rem .55rem; font-weight: 700; }
  h2:first-child { margin-top: .2rem; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: .85rem .95rem; }
  .card + .card { margin-top: .55rem; }

  /* ---- hero: current process position ---- */
  .hero { position: relative; overflow: hidden; border: 1px solid var(--edge-2);
    background: radial-gradient(120% 140% at 0% 0%, rgba(122,162,247,.14), transparent 55%), var(--panel); padding: 1.05rem 1.05rem 1.1rem; }
  .hero .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .14em; color: var(--faint); }
  .hero .atom-now { font-size: 1.5rem; font-weight: 700; margin: .25rem 0 .1rem; letter-spacing: -.01em; }
  .hero .flow { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; color: var(--dim); font-size: .82rem; }
  .hero .arrow { color: var(--faint); }
  .pill { font-size: .74rem; padding: .22rem .6rem; border-radius: 999px; border: 1px solid var(--edge-2); background: var(--panel-2); color: var(--dim); white-space: nowrap; }
  .pill.next { color: var(--accent); border-color: rgba(122,162,247,.4); background: rgba(122,162,247,.08); }
  .hero .inputs { margin-top: .65rem; font-size: .8rem; color: var(--faint); }

  details.raw { margin-top: .6rem; }
  details.raw > summary { list-style: none; cursor: pointer; color: var(--faint); font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; padding: .2rem 0; }
  details.raw > summary::-webkit-details-marker { display: none; }
  details.raw pre { margin: .4rem 0 0; white-space: pre-wrap; word-break: break-word; font-size: .78rem; color: var(--dim); background: var(--bg-2); border: 1px solid var(--edge); border-radius: 10px; padding: .7rem .8rem; }

  .atoms { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .1rem; }
  .atom { font-size: .74rem; padding: .3rem .6rem; border: 1px solid var(--edge); border-radius: 10px; color: var(--dim); background: var(--panel); }
  .atom b { color: var(--ink); font-weight: 600; }

  /* ---- teloi & tensions ---- */
  .telos { border-left: 3px solid var(--telos); }
  .telos .title { color: var(--telos); font-weight: 650; }
  .telos .stmt { color: var(--dim); font-size: .88rem; margin-top: .25rem; }
  .telos .wit { color: var(--faint); font-size: .73rem; margin-top: .4rem; }
  .tension { border-left: 3px solid var(--tension); }
  .tension .pair { color: var(--tension); font-weight: 650; font-size: .85rem; }
  .tension .why { color: var(--dim); font-size: .85rem; margin-top: .3rem; }

  /* ---- subjects browser ---- */
  .filter { width: 100%; padding: .7rem .9rem; margin-bottom: .7rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); font-size: .92rem; }
  .filter:focus { outline: none; border-color: var(--accent); }
  .filter::placeholder { color: var(--faint); }
  .subj-group { margin-bottom: .7rem; }
  .subj-group > .gh { display: flex; align-items: center; gap: .5rem; padding: .35rem .25rem; color: var(--faint); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; }
  .subj-group > .gh .count { margin-left: auto; text-transform: none; letter-spacing: 0; }

  details.subj { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; margin: .38rem 0; overflow: hidden; transition: border-color .15s ease; }
  details.subj[open] { border-color: var(--edge-2); }
  details.subj > summary { list-style: none; cursor: pointer; padding: .68rem .85rem; display: flex; align-items: center; gap: .55rem; }
  details.subj > summary::-webkit-details-marker { display: none; }
  details.subj > summary:active { background: var(--panel-2); }
  details.subj > summary .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.subj > summary .n { margin-left: auto; color: var(--dim); font-size: .74rem; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 999px; padding: .08rem .55rem; flex: none; }
  details.subj > summary .chev { color: var(--faint); transition: transform .18s ease; flex: none; }
  details.subj[open] > summary .chev { transform: rotate(90deg); }
  details.subj[open] > summary { border-bottom: 1px solid var(--edge); }
  .claims { padding: .35rem .85rem .65rem; }
  .claim { padding: .6rem 0; border-top: 1px dashed var(--edge); }
  .claim:first-child { border-top: none; }
  .claim .row1 { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .kind { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; padding: .12rem .48rem; border-radius: 6px; background: var(--panel-2); color: var(--dim); border: 1px solid var(--edge); }
  .kind.Decision { color: #a6c8ff; } .kind.Result { color: var(--good); } .kind.Observation { color: #c8d0dc; }
  .kind.Plan { color: var(--telos); } .kind.Subject { color: var(--accent); } .kind.Retraction, .kind.Status { color: var(--warn); }
  .claim .meta { color: var(--faint); font-size: .73rem; margin-left: auto; }
  .claim .summary { margin-top: .32rem; color: var(--ink); font-size: .9rem; word-break: break-word; }
  .claim .arts { margin-top: .34rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .art { font-size: .67rem; color: var(--faint); background: var(--panel-2); border: 1px solid var(--edge); border-radius: 6px; padding: .06rem .42rem; }
  .cites { color: var(--faint); font-size: .72rem; margin-top: .3rem; }

  /* claim drill-in */
  .claim.expandable { cursor: pointer; }
  .claim.expandable .summary::after { content: " ›"; color: var(--faint); }
  .claim.open .summary::after { content: " ⌄"; }
  .claim-detail { margin-top: .5rem; padding: .55rem .65rem; background: var(--bg-2); border: 1px solid var(--edge); border-radius: 10px; }
  .claim-detail .full-text { margin: 0 0 .4rem; white-space: pre-wrap; word-break: break-word; font-size: .82rem; color: var(--ink); font-family: inherit; }
  .claim-detail .detail-meta { color: var(--faint); font-size: .72rem; }
  .cite-list { margin-top: .5rem; }
  .cite-list .cite-h { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-bottom: .25rem; }
  .cite-line { display: flex; gap: .5rem; align-items: baseline; padding: .15rem 0; }
  .cite-line .cite-cid { color: var(--accent); font-size: .72rem; flex: none; }
  .cite-line .cite-sum { color: var(--dim); font-size: .8rem; word-break: break-word; }

  /* comments tab */
  .cfile { display: flex; align-items: center; gap: .6rem; padding: .7rem .85rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; margin: .38rem 0; cursor: pointer; }
  .cfile:active { background: var(--panel-2); }
  .cfile .name { font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cfile .cbadges { margin-left: auto; display: flex; gap: .35rem; flex: none; }
  .cbadge { font-size: .72rem; color: var(--dim); background: var(--panel-2); border: 1px solid var(--edge); border-radius: 999px; padding: .06rem .5rem; }
  .cbadge.unres { color: var(--warn); border-color: rgba(227,179,65,.4); background: rgba(227,179,65,.08); }
  .cback { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
  .backbtn { appearance: none; border: 1px solid var(--edge); background: var(--panel); color: var(--accent); border-radius: 999px; padding: .3rem .7rem; font-size: .78rem; cursor: pointer; }
  .cback .cpath { color: var(--faint); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ccomment { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: .7rem .85rem; margin: .4rem 0; cursor: pointer; }
  .ccomment:active { background: var(--panel-2); }
  .ccomment .row1 { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .cstate { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; padding: .1rem .45rem; border-radius: 6px; border: 1px solid var(--edge); color: var(--dim); }
  .cstate.anchored { color: var(--good); } .cstate.drifted { color: var(--warn); } .cstate.unresolvable { color: var(--bad); }
  .cline { font-size: .72rem; color: var(--faint); }
  .ccomment .meta { margin-left: auto; color: var(--faint); font-size: .73rem; }
  .cbody { margin-top: .32rem; color: var(--ink); font-size: .9rem; word-break: break-word; white-space: pre-wrap; }
  .cthreadlink { margin-top: .35rem; color: var(--accent); font-size: .76rem; }
  .creply { margin: .35rem 0 .35rem 1rem; padding: .55rem .7rem; background: var(--bg-2); border: 1px solid var(--edge); border-left: 2px solid var(--edge-2); border-radius: 10px; }
  .creply .meta { color: var(--faint); font-size: .72rem; margin-bottom: .2rem; }

  /* write affordances (only shown when --allow-writes) */
  .writebox { margin: .6rem 0; padding: .7rem .85rem; background: var(--panel); border: 1px dashed var(--edge-2); border-radius: 12px; display: flex; flex-direction: column; gap: .4rem; }
  .writeh { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
  .wtext { width: 100%; min-height: 3rem; resize: vertical; background: var(--bg-2); border: 1px solid var(--edge); border-radius: 8px; color: var(--ink); font: inherit; font-size: .88rem; padding: .5rem .6rem; }
  .wtext:focus, .winput:focus { outline: none; border-color: var(--accent); }
  .winput { width: 6rem; background: var(--bg-2); border: 1px solid var(--edge); border-radius: 8px; color: var(--ink); font: inherit; font-size: .85rem; padding: .4rem .5rem; }
  .wbtn { align-self: flex-start; appearance: none; border: 1px solid var(--accent); background: rgba(122,162,247,.12); color: var(--accent); border-radius: 999px; padding: .35rem .9rem; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .wbtn:disabled { opacity: .5; cursor: default; }
  .wbtn.small { align-self: auto; margin-left: auto; padding: .18rem .6rem; font-size: .72rem; }

  /* files browser + viewer (comment-creation slice) */
  .segmented { display: flex; gap: .3rem; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 999px; padding: .22rem; margin-bottom: .7rem; }
  .seg { flex: 1; appearance: none; border: none; background: transparent; color: var(--dim); font: inherit; font-size: .82rem; padding: .4rem .6rem; border-radius: 999px; cursor: pointer; }
  .seg.on { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); }
  .ffile { display: flex; align-items: center; gap: .55rem; padding: .55rem .8rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; margin: .3rem 0; cursor: pointer; }
  .ffile:active { background: var(--panel-2); }
  .ffile .fpath { font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ffile .fmark { flex: none; font-size: .7rem; color: var(--accent); }
  .ffile .fst { margin-left: auto; flex: none; font-size: .72rem; width: 1.1rem; text-align: center; color: var(--warn); }
  .vnotice, .vhint { font-size: .74rem; color: var(--faint); margin: .3rem .2rem .5rem; }
  .vcomments { margin: .2rem 0 .7rem; }
  .vch { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin: .2rem 0 .35rem; }
  .vcrow { display: flex; align-items: baseline; gap: .5rem; padding: .5rem .7rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; margin: .3rem 0; cursor: pointer; }
  .vcrow:active { background: var(--panel-2); }
  .vcrow .vcbody { color: var(--dim); font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .codeview { background: var(--bg-2); border: 1px solid var(--edge); border-radius: 10px; padding: .4rem 0; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; line-height: 1.5; }
  .codeline { display: flex; align-items: flex-start; min-width: max-content; padding: 0 .5rem; }
  .codeline:active { background: var(--panel-2); }
  .codeline.hascomment { background: rgba(122,162,247,.08); }
  .cgutter { flex: none; width: 1rem; text-align: center; color: var(--accent); font-size: .7rem; user-select: none; }
  .clnum { flex: none; width: 2.6rem; text-align: right; padding-right: .7rem; color: var(--faint); user-select: none; }
  .csrc { white-space: pre; }
  .addbox { margin-top: .6rem; }

  /* chat tab */
  .csession { padding: .65rem .85rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; margin: .38rem 0; cursor: pointer; }
  .csession:active { background: var(--panel-2); }
  .csession.sub { margin-left: 1rem; border-left: 2px solid var(--edge-2); }
  .csession .row1 { display: flex; align-items: baseline; gap: .5rem; }
  .harness { font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; padding: .1rem .42rem; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--edge); color: var(--accent); flex: none; }
  .stitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .csession .meta { margin-left: auto; color: var(--faint); font-size: .72rem; flex: none; }
  .turn { padding: .55rem .8rem; margin: .35rem 0; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge); }
  .turn.user { border-left: 3px solid var(--accent); }
  .turn.assistant { border-left: 3px solid var(--good); }
  .turn .trow { display: flex; align-items: baseline; gap: .5rem; }
  .trole { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .turn .meta { margin-left: auto; color: var(--faint); font-size: .7rem; }
  .tbody { margin-top: .3rem; color: var(--ink); font-size: .9rem; white-space: pre-wrap; word-break: break-word; }
  details.turn.collapsed { background: var(--bg-2); border-style: dashed; }
  details.turn.collapsed > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: .5rem; }
  details.turn.collapsed > summary::-webkit-details-marker { display: none; }
  .tkind { font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; color: var(--telos); flex: none; }
  .tpeek { color: var(--faint); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tfull { margin: .45rem 0 0; white-space: pre-wrap; word-break: break-word; font-size: .8rem; color: var(--dim); }

  .banner { background: rgba(247,118,142,.12); border: 1px solid var(--bad); color: #ffd7de; border-radius: 12px; padding: .65rem .85rem; font-size: .82rem; margin-bottom: 1rem; }
  .empty { color: var(--faint); text-align: center; padding: 2.5rem 1rem; }

  /* ---- bottom tab bar ---- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: center; gap: .2rem;
    padding: .3rem .5rem calc(.3rem + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(11,13,17,.96), rgba(11,13,17,.86));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--edge);
  }
  nav button {
    flex: 1; max-width: 150px; appearance: none; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: .12rem;
    padding: .5rem .3rem .4rem; color: var(--faint); font-size: .68rem; letter-spacing: .03em;
    border-radius: 12px; position: relative; transition: color .15s ease;
  }
  nav button .ic { font-size: 1.15rem; line-height: 1; }
  nav button .badge { position: absolute; top: .32rem; right: 50%; transform: translateX(1.35rem);
    font-size: .58rem; background: var(--accent); color: #0b0d11; border-radius: 999px; padding: .02rem .3rem; font-weight: 700; }
  nav button.active { color: var(--accent); }
  nav button.active::before { content: ""; position: absolute; top: .18rem; width: 26px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f9; --bg-2:#eaedf2; --panel:#fff; --panel-2:#eef1f5; --edge:#dce0e8; --edge-2:#cfd4de; --ink:#161a21; --dim:#4a5464; --faint:#8a92a2; }
    nav button .badge { color: #fff; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">cospan</span>
  <span class="dot" id="dot" title="connection"></span>
  <span class="spacer"></span>
  <span class="view-name" id="viewname">Now</span>
</header>

<main>
  <div id="banner"></div>

  <!-- NOW: process position -->
  <div class="view active" id="view-now">
    <div class="card hero" id="hero">
      <div class="lbl">Current atom</div>
      <div class="atom-now" id="atomNow">—</div>
      <div class="flow" id="flow"></div>
      <div class="inputs" id="inputs"></div>
      <details class="raw"><summary>raw day status</summary><pre id="daystatus">loading…</pre></details>
    </div>
    <h2>Atoms</h2>
    <div class="atoms" id="atoms"></div>
  </div>

  <!-- TELOI: north star -->
  <div class="view" id="view-telos">
    <h2>Teloi</h2>
    <div id="teloi"></div>
    <h2 id="tension-h" hidden>Tensions held</h2>
    <div id="tensions"></div>
  </div>

  <!-- BROWSE: subjects -->
  <div class="view" id="view-browse">
    <input class="filter" id="filter" placeholder="filter subjects…" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div id="subjects"></div>
  </div>

  <!-- COMMENTS: files → comments → thread -->
  <div class="view" id="view-comments">
    <div id="comments"></div>
  </div>

  <!-- CHAT: sessions → a session's turns -->
  <div class="view" id="view-chat">
    <div id="chat"></div>
  </div>
</main>

<nav id="nav">
  <button data-view="now"    class="active"><span class="ic">◎</span><span>Now</span></button>
  <button data-view="telos"><span class="ic">✦</span><span>Teloi</span></button>
  <button data-view="browse"><span class="ic">▤</span><span>Browse</span><span class="badge" id="subjBadge" hidden></span></button>
  <button data-view="comments"><span class="ic">✎</span><span>Comments</span></button>
  <button data-view="chat"><span class="ic">◇</span><span>Chat</span></button>
</nav>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  let fold = null;
  let expanded = new Set();
  let filter = "";
  let activeView = "now";
  let commentsIndex = null;   // [{file,total,unresolved}] from GET /comments
  let commentsMode = "commented"; // Comments tab: "commented" | "files"
  let filesList = null;       // [{path,status}] from GET /files (all files mode)
  let filesFilter = "";       // client-side substring filter over filesList
  let caps = { writes: false }; // GET /capabilities — gates the write affordances
  let started = false;        // has the first fold render happened (REQ-5)
  let ws = null;              // the live /stream socket
  let backoff = 1000;         // reconnect backoff, capped (REQ-4)
  let reconnectTimer = null;

  // Auth: the page is opened as `/?token=<t>`; reuse that token on every API
  // call and on the WS URL, so a single saved link works with no in-app entry.
  // Absent (the --no-auth case), URLs are unchanged.
  const TOKEN = new URLSearchParams(location.search).get("token") || "";
  const withTok = (path) =>
    TOKEN ? path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : path;

  const ns = (s) => { const i = s.indexOf("/"); return i < 0 ? s : s.slice(0, i); };
  const leaf = (s) => s.includes("/") ? s.slice(s.indexOf("/") + 1) : s;
  const bare = (s) => (s || "").replace(/^(atom|telos)\//, "");
  const fmtWhen = (micros) => {
    if (micros == null) return "date unknown";
    const d = new Date(micros / 1000); if (isNaN(d)) return "date unknown";
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  };
  const shortAuthor = (a) => { a = (a || "").replace(/^did:key:/, ""); return a.length > 11 ? a.slice(0,6) + "…" + a.slice(-4) : a; };
  const summarize = (c) => {
    if (c.kind === "Retraction" && c.supersedes) return "retracts " + c.supersedes.slice(-8);
    if (c.text) { const l = c.text.split("\n").find((x) => x.trim()); if (l) return l.trim(); }
    if (c.title) return `"${c.title}"`;
    return `(${(c.kind||"claim").toLowerCase()})`;
  };
  const dayField = (re) => { const m = (fold && fold.day_status || "").match(re); return m ? m[1].trim() : null; };

  // ---- views ----
  function setView(v) {
    activeView = v;
    document.querySelectorAll(".view").forEach((n) => n.classList.toggle("active", n.id === "view-" + v));
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
    $("viewname").textContent = { now: "Now", telos: "Teloi", browse: "Browse", comments: "Comments", chat: "Chat" }[v];
    window.scrollTo({ top: 0 });
    // Comments and Chat are fetched (not in the fold) and don't auto-update over
    // /stream — (re)load fresh each time the tab is opened, resetting to level 0.
    if (v === "comments") loadComments();
    if (v === "chat") loadChatIndex();
  }

  function render() {
    if (!fold) return;

    const b = $("banner"); b.innerHTML = "";
    if (fold.errors && fold.errors.length) {
      const box = el("div", "banner");
      box.appendChild(el("strong", null, "fold errors: "));
      box.appendChild(document.createTextNode(fold.errors.join(" · ")));
      b.appendChild(box);
    }

    renderNow();
    renderTeloi();
    renderSubjects();
  }

  function renderNow() {
    const cur = dayField(/Current atom:\s*(.+)/) || bare((fold.process?.atoms?.[0]?.slug) || "—");
    $("atomNow").textContent = cur;

    const next = dayField(/^\s*next:\s*(.+)/m);
    const flow = $("flow"); flow.innerHTML = "";
    flow.appendChild(el("span", "pill", cur));
    if (next) { flow.appendChild(el("span", "arrow", "→")); next.split(/,\s*/).forEach((n) => flow.appendChild(el("span", "pill next", n))); }

    const inputs = dayField(/inputs satisfied:\s*(.+)/);
    $("inputs").textContent = inputs ? "inputs satisfied: " + inputs : "";

    $("daystatus").textContent = (fold.day_status && fold.day_status.trim()) ? fold.day_status : "(day status unavailable)";

    const atoms = $("atoms"); atoms.innerHTML = "";
    (fold.process?.atoms || []).forEach((a) => {
      const chip = el("span", "atom");
      chip.appendChild(el("b", null, bare(a.slug)));
      if (a.next && a.next.length) chip.appendChild(document.createTextNode(" → " + a.next.join(", ")));
      atoms.appendChild(chip);
    });
    if (!atoms.children.length) atoms.appendChild(el("div", "empty", "no atoms declared"));
  }

  function renderTeloi() {
    const t = $("teloi"); t.innerHTML = "";
    const teloi = fold.process?.teloi || [];
    teloi.forEach((v) => {
      const card = el("div", "card telos");
      card.appendChild(el("div", "title", v.title || v.slug));
      if (v.statement) card.appendChild(el("div", "stmt", v.statement));
      if (v.witnesses && v.witnesses.length) card.appendChild(el("div", "wit", "witnesses: " + v.witnesses.join(", ")));
      t.appendChild(card);
    });
    if (!teloi.length) t.appendChild(el("div", "empty", "no teloi"));

    const tn = $("tensions"); tn.innerHTML = "";
    const tensions = fold.process?.tensions || [];
    tensions.forEach((x) => {
      const card = el("div", "card tension");
      card.appendChild(el("div", "pair", `${x.between[0]} ⇄ ${x.between[1]}`));
      if (x.why) card.appendChild(el("div", "why", x.why));
      tn.appendChild(card);
    });
    $("tension-h").hidden = tensions.length === 0;
  }

  function renderSubjects() {
    const host = $("subjects"); host.innerHTML = "";
    const all = fold.subjects || [];
    const subjects = all.filter((s) => !filter || s.toLowerCase().includes(filter));

    const badge = $("subjBadge"); badge.hidden = all.length === 0; badge.textContent = all.length;

    if (!subjects.length) { host.appendChild(el("div", "empty", filter ? "no subjects match" : "no subjects")); return; }

    const groups = new Map();
    subjects.forEach((s) => { const k = ns(s); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
    const keys = [...groups.keys()].sort((a,b) => groups.get(b).length - groups.get(a).length || a.localeCompare(b));

    keys.forEach((k) => {
      const list = groups.get(k);
      const g = el("div", "subj-group");
      const gh = el("div", "gh");
      gh.appendChild(el("span", "mono", k));
      gh.appendChild(el("span", "count", String(list.length)));
      g.appendChild(gh);
      list.sort().forEach((s) => g.appendChild(subjectEl(s)));
      host.appendChild(g);
    });
  }

  function subjectEl(subject) {
    const claims = (fold.claims && fold.claims[subject]) || [];
    const d = el("details", "subj");
    if (expanded.has(subject)) d.open = true;
    d.addEventListener("toggle", () => { d.open ? expanded.add(subject) : expanded.delete(subject); });
    const sum = el("summary");
    sum.appendChild(el("span", "chev", "›"));
    sum.appendChild(el("span", "name", leaf(subject)));
    sum.appendChild(el("span", "n", String(claims.length)));
    d.appendChild(sum);
    const body = el("div", "claims");
    if (!claims.length) body.appendChild(el("div", "cites", "no live claims"));
    claims.forEach((c) => body.appendChild(claimEl(c)));
    d.appendChild(body);
    return d;
  }

  function claimEl(c) {
    const w = el("div", "claim");
    const r1 = el("div", "row1");
    r1.appendChild(el("span", "kind " + (c.kind||""), c.kind || "claim"));
    r1.appendChild(el("span", "meta", `${shortAuthor(c.author)} · ${fmtWhen(c.recorded_at)}`));
    w.appendChild(r1);
    w.appendChild(el("div", "summary", summarize(c)));
    if (c.artifacts && c.artifacts.length) {
      const a = el("div", "arts");
      c.artifacts.forEach((art) => a.appendChild(el("span", "art mono", art)));
      w.appendChild(a);
    }

    // Drill-in (REQ-3): tap to reveal the full untruncated text, the cites
    // resolved through the fold's by_cid map, author, and time. Only offered when
    // there is more than the one-line summary already shown.
    const multiline = c.text && c.text.trim() !== summarize(c);
    const hasCites = c.cites && c.cites.length;
    if (hasCites) w.appendChild(el("div", "cites", `cites ${c.cites.length} ·  tap to expand`));
    else if (multiline) w.appendChild(el("div", "cites", "tap to expand"));

    if (multiline || hasCites) {
      w.classList.add("expandable");
      const detail = el("div", "claim-detail");
      detail.hidden = true;
      if (c.text) {
        const pre = el("pre", "full-text");
        pre.textContent = c.text;
        detail.appendChild(pre);
      }
      detail.appendChild(el("div", "detail-meta", `${c.author || "?"} · ${fmtWhen(c.recorded_at)} · ${c.cid ? c.cid.slice(-10) : ""}`));
      if (hasCites) {
        const ci = el("div", "cite-list");
        ci.appendChild(el("div", "cite-h", "cites"));
        c.cites.forEach((cid) => {
          const cited = fold.by_cid && fold.by_cid[cid];
          const line = el("div", "cite-line");
          line.appendChild(el("span", "cite-cid mono", cid.slice(-8)));
          line.appendChild(el("span", "cite-sum", cited ? summarize(cited) : "(not in this fold)"));
          ci.appendChild(line);
        });
        detail.appendChild(ci);
      }
      w.appendChild(detail);
      w.addEventListener("click", () => {
        detail.hidden = !detail.hidden;
        w.classList.toggle("open", !detail.hidden);
      });
    }
    return w;
  }

  // ---- comments: files → a file's comments → one comment's thread ----
  // Writes (add/reply/resolve) appear only when the server reports the capability
  // (`--allow-writes`); otherwise the tab is read-only.
  async function loadCaps() {
    try {
      const r = await fetch(withTok("/capabilities"), { cache: "no-store" });
      caps = await r.json();
    } catch (e) { caps = { writes: false }; }
  }
  async function postJson(path, body) {
    const r = await fetch(withTok(path), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    return r.json().catch(() => ({}));
  }
  function writeBox(title, placeholder, onSubmit, extra) {
    const box = el("div", "writebox");
    box.appendChild(el("div", "writeh", title));
    if (extra) box.appendChild(extra);
    const ta = el("textarea", "wtext");
    ta.placeholder = placeholder;
    const btn = el("button", "wbtn", title);
    btn.addEventListener("click", async () => {
      const b = ta.value.trim();
      if (!b) return;
      btn.disabled = true;
      await onSubmit(b);
    });
    box.appendChild(ta);
    box.appendChild(btn);
    return box;
  }

  function backBar(label, onBack) {
    const bar = el("div", "cback");
    const b = el("button", "backbtn", "‹ back");
    b.addEventListener("click", onBack);
    bar.appendChild(b);
    bar.appendChild(el("span", "cpath mono", label));
    return bar;
  }

  // The Comments tab is one file surface with an `all files | commented` toggle.
  // `commented` (default) is the files-with-comments index (GET /comments);
  // `all files` is the browsable tree (GET /files), so a file with *no* comments
  // can be reached to receive its first one. Both open the same file viewer.
  async function loadComments() {
    const host = $("comments");
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "loading…"));
    if (commentsMode === "files") { await loadFilesData(); await loadCommentIndexData(); }
    else await loadCommentIndexData();
    renderCommentsHome();
  }

  async function loadCommentIndexData() {
    try {
      const r = await fetch(withTok("/comments"), { cache: "no-store" });
      commentsIndex = (await r.json()).files || [];
    } catch (e) { commentsIndex = []; }
  }

  async function loadFilesData() {
    try {
      const r = await fetch(withTok("/files"), { cache: "no-store" });
      filesList = (await r.json()).files || [];
    } catch (e) { filesList = []; }
  }

  function commentsToggle() {
    const bar = el("div", "segmented");
    const mk = (mode, label) => {
      const b = el("button", "seg" + (commentsMode === mode ? " on" : ""), label);
      b.addEventListener("click", () => { if (commentsMode !== mode) { commentsMode = mode; loadComments(); } });
      return b;
    };
    bar.appendChild(mk("commented", "Commented"));
    bar.appendChild(mk("files", "All files"));
    return bar;
  }

  function renderCommentsHome() {
    const host = $("comments");
    host.innerHTML = "";
    host.appendChild(commentsToggle());
    const body = el("div", "chome-body");
    host.appendChild(body);
    if (commentsMode === "files") renderFilesBrowser(body);
    else renderCommentIndex(body);
  }

  function renderCommentIndex(host) {
    if (!commentsIndex || !commentsIndex.length) {
      host.appendChild(el("div", "empty", "no comments yet — switch to All files to add one"));
      return;
    }
    host.appendChild(el("h2", null, "Files with comments"));
    commentsIndex.forEach((f) => {
      const row = el("div", "cfile");
      row.appendChild(el("span", "name mono", f.file));
      const badges = el("span", "cbadges");
      if (f.unresolved) badges.appendChild(el("span", "cbadge unres", `${f.unresolved} open`));
      badges.appendChild(el("span", "cbadge", String(f.total)));
      row.appendChild(badges);
      row.addEventListener("click", () => openFileViewer(f.file));
      host.appendChild(row);
    });
  }

  function renderFilesBrowser(host) {
    const filter = el("input", "filter");
    filter.placeholder = "filter files…";
    filter.setAttribute("autocomplete", "off");
    filter.setAttribute("autocapitalize", "off");
    filter.setAttribute("spellcheck", "false");
    filter.value = filesFilter;
    host.appendChild(filter);
    const listWrap = el("div", "flist");
    host.appendChild(listWrap);
    // files that already carry comments, for an at-a-glance badge in the list
    const commented = new Set((commentsIndex || []).map((f) => f.file));
    const draw = () => {
      listWrap.innerHTML = "";
      const q = filesFilter.trim().toLowerCase();
      const rows = (filesList || []).filter((f) => !q || f.path.toLowerCase().includes(q));
      if (!rows.length) {
        listWrap.appendChild(el("div", "empty", (filesList && filesList.length) ? "no files match" : "no files"));
        return;
      }
      rows.forEach((f) => {
        const row = el("div", "ffile");
        if (commented.has(f.path)) row.appendChild(el("span", "fmark", "✎"));
        row.appendChild(el("span", "fpath mono", f.path));
        const st = (f.status || "").trim();
        if (st) row.appendChild(el("span", "fst", st));
        row.addEventListener("click", () => openFileViewer(f.path));
        listWrap.appendChild(row);
      });
    };
    filter.addEventListener("input", () => { filesFilter = filter.value; draw(); });
    draw();
  }

  // The file viewer: highlighted content + a gutter marking commented lines, an
  // exhaustive comment list (so every comment is reachable regardless of anchor
  // state), and — under --allow-writes — tap-a-line to add the first comment.
  async function openFileViewer(file) {
    const host = $("comments");
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "loading…"));
    let fileData, comments;
    try {
      const [fr, cr] = await Promise.all([
        fetch(withTok("/file?path=" + encodeURIComponent(file)), { cache: "no-store" }),
        fetch(withTok("/comments?file=" + encodeURIComponent(file)), { cache: "no-store" }),
      ]);
      fileData = await fr.json();
      comments = (await cr.json()).comments || [];
    } catch (e) {
      fileData = { error: String(e) }; comments = [];
    }
    host.innerHTML = "";
    host.appendChild(backBar(file, () => renderCommentsHome()));
    if (!fileData || fileData.error) {
      host.appendChild(el("div", "empty", (fileData && fileData.error) ? fileData.error : "cannot open file"));
      return;
    }
    const byLine = new Map();
    comments.forEach((c) => {
      if (c.line != null) {
        if (!byLine.has(c.line)) byLine.set(c.line, []);
        byLine.get(c.line).push(c);
      }
    });
    if (comments.length) {
      const cwrap = el("div", "vcomments");
      cwrap.appendChild(el("div", "vch", `${comments.length} comment${comments.length === 1 ? "" : "s"} on this file`));
      comments.forEach((c) => {
        const row = el("div", "vcrow");
        row.appendChild(el("span", "cstate " + (c.state || ""), c.state || ""));
        row.appendChild(el("span", "cline", c.line != null ? "line " + c.line : "unanchored"));
        row.appendChild(el("span", "vcbody", c.body));
        row.addEventListener("click", () => openThread(file, c.id));
        cwrap.appendChild(row);
      });
      host.appendChild(cwrap);
    }
    if (fileData.truncated) {
      const shown = (fileData.lines || []).length;
      // A line-truncated file knows its real total; a byte-truncated one (a huge
      // low-newline file) does not, so say so honestly rather than "N of N".
      const notice = (fileData.total > shown)
        ? `showing first ${shown} of ${fileData.total} lines`
        : "showing a truncated head — file too large";
      host.appendChild(el("div", "vnotice", notice));
    }
    if (caps.writes) host.appendChild(el("div", "vhint", "tap a line to comment on it"));
    const code = el("div", "codeview");
    (fileData.lines || []).forEach((runs, i) => {
      const lineNo = i + 1;
      const row = el("div", "codeline");
      const gutter = el("span", "cgutter");
      const marks = byLine.get(lineNo);
      if (marks && marks.length) { row.classList.add("hascomment"); gutter.textContent = marks.length > 1 ? String(marks.length) : "●"; }
      row.appendChild(gutter);
      row.appendChild(el("span", "clnum", String(lineNo)));
      const src = el("span", "csrc");
      if (!runs.length) src.appendChild(document.createTextNode(" "));
      runs.forEach((run) => { const sp = el("span", null, run.t); if (run.c) sp.style.color = run.c; src.appendChild(sp); });
      row.appendChild(src);
      row.addEventListener("click", () => {
        if (marks && marks.length) { openThread(file, marks[0].id); return; }
        if (caps.writes) startAddAt(file, lineNo);
      });
      code.appendChild(row);
    });
    host.appendChild(code);
  }

  function startAddAt(file, lineNo) {
    const host = $("comments");
    const prev = host.querySelector(".addbox");
    if (prev) prev.remove();
    const lineInput = el("input", "winput");
    lineInput.type = "number"; lineInput.min = "1"; lineInput.value = String(lineNo);
    const box = writeBox("Add · line " + lineNo, "new comment…", async (b) => {
      await postJson("/comments?file=" + encodeURIComponent(file), { line: parseInt(lineInput.value, 10) || lineNo, body: b });
      openFileViewer(file);
    }, lineInput);
    box.classList.add("addbox");
    host.appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    const ta = box.querySelector(".wtext"); if (ta) ta.focus();
  }

  async function openThread(file, id) {
    const host = $("comments");
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "loading…"));
    let c;
    try {
      const r = await fetch(withTok(`/thread?file=${encodeURIComponent(file)}&id=${encodeURIComponent(id)}`), { cache: "no-store" });
      c = await r.json();
    } catch (e) {
      c = { error: String(e) };
    }
    host.innerHTML = "";
    host.appendChild(backBar(file, () => openFileViewer(file)));
    if (!c || c.error) {
      host.appendChild(el("div", "empty", c && c.error ? c.error : "not found"));
      return;
    }
    const head = el("div", "ccomment");
    const r1 = el("div", "row1");
    r1.appendChild(el("span", "cstate " + (c.state || ""), c.state || ""));
    if (c.line != null) r1.appendChild(el("span", "cline", "line " + c.line));
    const who = c.author ? `${c.author.who}:${c.author.id}` : "";
    r1.appendChild(el("span", "meta", who + (c.resolved ? " · resolved" : "")));
    head.appendChild(r1);
    head.appendChild(el("div", "cbody", c.body));
    if (caps.writes) {
      const rbtn = el("button", "wbtn small", c.resolved ? "Unresolve" : "Resolve");
      rbtn.addEventListener("click", async () => {
        rbtn.disabled = true;
        await postJson(`/resolve?file=${encodeURIComponent(file)}&id=${encodeURIComponent(id)}`, { value: !c.resolved });
        openThread(file, id);
      });
      head.appendChild(rbtn);
    }
    host.appendChild(head);
    (c.replies || []).forEach((r) => {
      const rep = el("div", "creply");
      rep.appendChild(el("div", "meta", r.author ? `${r.author.who}:${r.author.id}` : ""));
      rep.appendChild(el("div", "cbody", r.body));
      host.appendChild(rep);
    });
    if (caps.writes) {
      host.appendChild(writeBox("Reply", "reply…", async (b) => {
        await postJson(`/thread?file=${encodeURIComponent(file)}&id=${encodeURIComponent(id)}`, { body: b });
        openThread(file, id);
      }));
    }
  }

  // ---- chat: sessions → a session's turns ----
  const relTime = (ms) => {
    const diff = Date.now() - ms;
    if (diff < 0) return "";
    const m = Math.floor(diff / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  };
  const COLLAPSES = new Set(["thinking", "toolcall", "toolresult"]);

  async function loadChatIndex() {
    const host = $("chat");
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "loading…"));
    let sessions = [];
    try {
      const r = await fetch(withTok("/chat"), { cache: "no-store" });
      sessions = (await r.json()).sessions || [];
    } catch (e) { sessions = []; }
    host.innerHTML = "";
    if (!sessions.length) {
      host.appendChild(el("div", "empty", "no chat sessions for this repo"));
      return;
    }
    host.appendChild(el("h2", null, "Sessions"));
    sessions.forEach((s) => {
      const row = el("div", "csession" + (s.is_subagent ? " sub" : ""));
      const top = el("div", "row1");
      top.appendChild(el("span", "harness", s.harness));
      top.appendChild(el("span", "stitle", s.title || s.id));
      if (s.last_active) top.appendChild(el("span", "meta", relTime(s.last_active)));
      row.appendChild(top);
      if (!s.body_available) row.appendChild(el("div", "cites", "body unavailable"));
      else row.addEventListener("click", () => openChatSession(s.id, s.title || s.id));
      host.appendChild(row);
    });
  }

  async function openChatSession(id, title) {
    const host = $("chat");
    host.innerHTML = "";
    host.appendChild(el("div", "empty", "loading…"));
    let s;
    try {
      const r = await fetch(withTok("/chat?session=" + encodeURIComponent(id)), { cache: "no-store" });
      s = await r.json();
    } catch (e) { s = { error: String(e) }; }
    host.innerHTML = "";
    host.appendChild(backBar(title, loadChatIndex));
    if (!s || s.error) {
      host.appendChild(el("div", "empty", s && s.error ? s.error : "unavailable"));
      return;
    }
    const events = s.events || [];
    if (!events.length) host.appendChild(el("div", "empty", "no turns"));
    events.forEach((e) => host.appendChild(turnEl(e)));
  }

  function turnEl(e) {
    if (COLLAPSES.has(e.kind)) {
      // thinking / tool traffic: a dim one-liner that expands to the text on tap
      const d = el("details", "turn collapsed");
      const sum = el("summary");
      sum.appendChild(el("span", "tkind", e.kind));
      const first = (e.text || "").split("\n").find((x) => x.trim()) || "";
      sum.appendChild(el("span", "tpeek", first.slice(0, 80)));
      d.appendChild(sum);
      const pre = el("pre", "tfull");
      pre.textContent = e.text || "";
      d.appendChild(pre);
      return d;
    }
    const w = el("div", "turn " + (e.role || ""));
    const r1 = el("div", "trow");
    r1.appendChild(el("span", "trole", e.role));
    if (e.ts) r1.appendChild(el("span", "meta", e.ts));
    w.appendChild(r1);
    w.appendChild(el("div", "tbody", e.text || ""));
    return w;
  }

  // ---- data ----
  function setDot(s) { const d = $("dot"); d.className = "dot" + (s ? " " + s : ""); d.title = s || "connecting"; }

  // When the fetch fallback did the initial paint, the /stream connect-snapshot
  // that follows carries the same state — skip exactly that one frame so startup
  // renders once (REQ-5). Armed only briefly, so a genuine (later) reconnect
  // snapshot is never suppressed — it must render to catch up.
  let skipNextFrame = false;

  // Apply a fold and (re)render. `started` gates the initial paint so the fetch
  // fallback and the /stream connect-snapshot don't both render at startup (REQ-5).
  function applyFold(f) { fold = f; render(); started = true; }

  // Fallback first-paint if /stream is slow to deliver its snapshot; only paints
  // if the socket hasn't already (REQ-5). Never renders over live WS data.
  async function load() {
    try {
      const r = await fetch(withTok("/fold"), { cache: "no-store" });
      const f = await r.json();
      if (!started) {
        applyFold(f);
        // The next /stream frame (this connection's connect-snapshot) is the same
        // state we just painted — skip it. Disarm after 2s so a real reconnect
        // snapshot much later still renders.
        skipNextFrame = true;
        setTimeout(() => { skipNextFrame = false; }, 2000);
      }
    } catch (e) {
      if (!started) $("daystatus").textContent = "failed to load /fold: " + e;
    }
  }

  // Capped-backoff, visibility-aware /stream reconnect (REQ-4).
  function scheduleReconnect() {
    if (document.hidden) return;             // resume on visibilitychange instead
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30000);  // 1s → 2s → … → 30s cap
  }
  function connect() {
    if (document.hidden) return;             // don't hold a socket while hidden
    if (ws) { try { ws.onclose = null; ws.onerror = null; ws.close(); } catch (_) {} ws = null; }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    try { ws = new WebSocket(`${proto}://${location.host}${withTok("/stream")}`); }
    catch (e) { setDot("dead"); scheduleReconnect(); return; }
    ws.onopen = () => { setDot("live"); backoff = 1000; };  // reset backoff on success
    ws.onmessage = (ev) => {
      if (skipNextFrame) { skipNextFrame = false; return; }  // the post-fetch connect-snapshot (REQ-5)
      try { applyFold(JSON.parse(ev.data)); } catch (_) {}
    };
    ws.onclose = () => { setDot("stale"); scheduleReconnect(); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(reconnectTimer);
      if (ws) { try { ws.onclose = null; ws.onerror = null; ws.close(); } catch (_) {} ws = null; }
      setDot("stale");
    } else {
      backoff = 1000;
      connect();  // reconnect immediately on return to foreground
    }
  });

  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  $("filter").addEventListener("input", (e) => { filter = e.target.value.trim().toLowerCase(); renderSubjects(); });

  setDot(""); setView("now");
  loadCaps();                                   // learn whether writes are enabled
  connect();                                    // /stream paints first, normally
  setTimeout(() => { if (!started) load(); }, 800);  // fetch fallback if WS is silent
})();
</script>
</body>
</html>
