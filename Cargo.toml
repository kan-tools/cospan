[package]
name = "cospan"
version = "0.0.1-alpha.28"
edition = "2021"
description = "A viewer that glues many local agent sessions, files, and kan claims into one apex view — plus a drift-tracking comment layer for AI-driven dev."
license = "MIT OR Apache-2.0"
publish = false  # not for crates.io yet; this is the working tool

[dependencies]
crossterm = "0.29"
pulldown-cmark = "0.13.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# onig (the C regex engine syntect/bat default to): far faster grammar compile
# and matching than fancy-regex. Needs a C compiler, which CI's ubuntu runner has.
syntect = { version = "5.2", default-features = false, features = ["default-onig"] }
# A much larger syntax set (bat's ~150 languages, incl. Lean) layered onto syntect.
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
# The comment MCP server (S5): the official Rust MCP SDK over stdio, plus its
# schema + async-runtime deps. Pure Rust (no C toolchain).
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
# The mobile read-API server (Phase 1): axum over the same tokio runtime the MCP
# server already builds — no second async runtime. `ws` for the /stream push;
# `net`/`sync`/`time` on tokio for the TcpListener, the broadcast channel, and the
# 250ms fold-loop tick.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
# OS randomness for the `cospan serve` auth token (minted at startup, held in
# memory only). Tiny, and already in the tree transitively.
getrandom = "0.3"

[dev-dependencies]
# A real WebSocket client for the `#[ignore]`d server smoke (AC-3): drives the
# handshake and reads pushed frames robustly (extended-length + fragmentation),
# which a hand-rolled reader would get wrong on a large fold. Test-only — nothing
# here ships in the binary, so it does not touch the server's disposability.
tokio-tungstenite = "0.29"
futures-util = "0.3"

[[bin]]
name = "cospan"
path = "src/main.rs"

[lib]
name = "cospan"
path = "src/lib.rs"
