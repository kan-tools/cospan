[package]
name = "cospan"
version = "0.0.1-alpha.16"
edition = "2021"
description = "A viewer that glues many local agent sessions, files, and kan claims into one apex view — plus a drift-tracking comment layer for AI-driven dev."
license = "MIT OR Apache-2.0"
publish = false  # not for crates.io yet; this is the working tool

[dependencies]
crossterm = "0.29"
pulldown-cmark = "0.13.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Pure-Rust regex (fancy-regex, not the onig C library) so CI needs no C toolchain.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
# A much larger syntax set (bat's ~150 languages, incl. Lean) layered onto syntect.
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

[[bin]]
name = "cospan"
path = "src/main.rs"

[lib]
name = "cospan"
path = "src/lib.rs"
